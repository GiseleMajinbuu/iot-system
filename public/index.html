<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portal IoT - UFSC</title>
    <style>
        .hidden { display: none; }
        section { margin-bottom: 20px; border: 1px solid #ccc; padding: 15px; }
    </style>
</head>
<body>
    <h1>Gerenciamento de Dispositivos IoT</h1>

    <section id="register-section">
        <h2>Criar Conta</h2>
        <input type="text" id="reg-nome" placeholder="Nome Completo"><br><br>
        <input type="email" id="reg-email" placeholder="Email"><br><br>
        <input type="password" id="reg-senha" placeholder="Senha"><br><br>
        <button onclick="register()">Cadastrar</button>
        <p>Já tem conta? <button onclick="toggleAuth(true)">Fazer Login</button></p>
    </section>

    <section id="login-section" class="hidden">
        <h2>Acesso ao Portal</h2>
        <input type="email" id="login-email" placeholder="Email"><br><br>
        <input type="password" id="login-senha" placeholder="Senha"><br><br>
        <button onclick="login()">Entrar</button>
        <p>Não tem conta? <button onclick="toggleAuth(false)">Cadastrar-se</button></p>
    </section>

    <div id="dashboard" class="hidden">
        <h2>Bem-vindo, <span id="user-display"></span>!</h2>
        <button onclick="logout()">Sair</button>
        <hr>
        
        <h3>Registrar Novo Sensor</h3>
        <input type="text" id="dev-apelido" placeholder="Apelido do Sensor">
        <input type="text" id="dev-unidade" placeholder="Unidade (ex: $kg/m^{3}$)"> <button onclick="addDevice()">Cadastrar Dispositivo</button>

        <h3>Meus Sensores</h3>
        <table border="1" width="100%">
            <thead>
                <tr>
                    <th>Apelido</th>
                    <th>DeviceID</th>
                    <th>DevicePWD</th>
                    <th>Unidade</th>
                    <th>Último Valor</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="sensor-list"></tbody>
        </table>
    </div>

    <script src="app.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <h3>Monitoramento em Tempo Real</h3>
    <div id="charts-container" style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;">
    </div>
</body>
</html>
